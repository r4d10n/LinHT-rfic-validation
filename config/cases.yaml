# Validation cases. tb paths are relative to the LinHT-rfic repo root.
cases:
  lodiv_chain_tt:
    tb: macros/lodiv_top/testbenches/ngspice/lodiv_chain_tb.spice
    corner: tt
    params: {divsel: 0, fin: 4.4e9, vpp: 0.4}
    signals: [lo_i, lo_q, clk_vco_div, i_vdd]
  lodiv_chain_ss_edge:
    tb: macros/lodiv_top/testbenches/ngspice/lodiv_chain_tb.spice
    corner: ss
    params: {divsel: 0, fin: 4.16e9, vpp: 0.4}
    signals: [lo_i, lo_q, clk_vco_div]

transient:
  digital:
    vth_v: 0.75         # logic threshold (1.5 V rail / 2)
    median_skew_s: 1.0e-10   # per-edge skew vs ngspice reference
    max_skew_s: 5.0e-10      # worst-edge skew bound
  supply:
    mean_tol: 0.02      # steady-state mean current within 2%
    env_tol: 0.25       # peak envelope within 25% of span
